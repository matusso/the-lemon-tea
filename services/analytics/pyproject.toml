[project]
name = "lemontea-analytics"
version = "0.1.0"
description = "Offline calibration, backtesting and model research for The Lemon Tea"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2",
  "polars>=1.30",
  "scipy>=1.15",
  "scikit-learn>=1.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
fastf1 = ["fastf1>=3.9"]
gbm = ["lightgbm>=4.6"]

[project.scripts]
lemontea-analytics = "lemontea_analytics.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemontea_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
